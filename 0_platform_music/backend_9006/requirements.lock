# 생성물입니다. 손으로 고치지 마세요. 최상위 선언은 requirements.txt 를 보세요.
#
# 무엇인가:
#   현재 정상 동작 중인 9006 venv 의 `pip freeze` 를 그대로 박제한 전량 고정
#   목록입니다. Dockerfile 이 설치하는 것은 requirements.txt 가 아니라 이 파일이며,
#   그래서 "지금 돌아가는 조합"이 언제 빌드해도 그대로 재현됩니다.
#
# v199 변경 — torch 계열 전면 제거:
#   「내 목소리로 변환」(Kits.AI) · 「보컬 다듬기」 · Demucs 를 코드에서 삭제하면서
#   torch 를 요구하는 것이 하나도 남지 않았다. 그래서 아래를 함께 걷어냈다.
#     demucs, dora_search, julius, openunmix   (Demucs 본체와 그 전용 의존)
#     lameenc, einops, treetable, submitit,
#     retrying, omegaconf, antlr4-python3-runtime, cloudpickle
#                                              (demucs/dora_search 전용 전이 의존)
#     torch, torchaudio                        (요구자가 사라짐)
#     sympy, mpmath, networkx, filelock, fsspec(torch 전용 전이 의존)
#     --extra-index-url https://download.pytorch.org/whl/cpu
#                                              (torch CPU 휠 전용 인덱스, 불필요)
#   v198 의 constraints-cpu.txt 도 같은 이유로 삭제됐다.
#
#   librosa / madmom / numba / llvmlite / scipy / scikit-learn / pyloudnorm 등은
#   그대로 남는다 — MV 비트 분석(audio_utils.py, beat_extraction.py, mv_pipeline.py)
#   이 쓴다. torch 와 무관한 계열이다.
#
# 갱신 절차 (의존성을 바꾼 뒤에만):
#   1) requirements.txt 를 먼저 수정하고 개발 venv 에 반영한다.
#   2) cd backend_9006 && ./venv/bin/pip freeze > requirements.lock
#   3) 최상단의 이 주석 블록을 다시 넣는다.
#   4) torch / torchaudio / demucs 계열이 다시 나타났다면 무엇이 끌고 왔는지
#      먼저 밝힌다. v199 기준으로는 어떤 코드도 torch 를 import 하지 않는다.
#   5) madmom 줄이 `@main` 이 아니라 커밋 해시인지 확인한다.
#   6) docker build 로 자기검증 RUN 이 통과하는지 확인한다.
