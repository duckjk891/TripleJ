# =============================================================================
# requirements.lock  — v198 (2026-08-21) / MAIDOL backend_9006
# =============================================================================
# 생성물입니다. 손으로 고치지 마세요. 최상위 선언은 requirements.txt 를 보세요.
#
# 무엇인가:
#   현재 정상 동작 중인 9006 venv 의 `pip freeze` 를 그대로 박제한 전량 고정
#   목록입니다. Dockerfile 이 설치하는 것은 requirements.txt 가 아니라 이 파일이며,
#   그래서 "지금 돌아가는 조합"이 언제 빌드해도 그대로 재현됩니다.
#
# 갱신 절차 (의존성을 바꾼 뒤에만):
#   1) requirements.txt 를 먼저 수정하고 개발 venv 에 반영한다.
#   2) cd backend_9006 && ./venv/bin/pip freeze > requirements.lock
#   3) 최상단의 이 주석 블록과 아래 --extra-index-url 줄을 다시 넣는다.
#   4) nvidia-* / triton / cuda-* 줄을 전부 지운다.
#      (개발 venv 는 CUDA 링크 torch 를 쓰고 있어 freeze 하면 다시 딸려 나온다.)
#   5) torch / torchaudio 를 `+cpu` 로컬 버전으로 바꾼다.
#      예: torch==2.12.0  →  torch==2.12.0+cpu
#   6) madmom 줄이 `@main` 이 아니라 커밋 해시인지 확인한다.
#   7) docker build 로 자기검증 RUN 이 통과하는지 확인한다.
#
# CPU 전용인 이유:
#   코드가 GPU 를 쓰지 않는다(demucs_service.py:92 가 device="cpu" 하드코딩,
#   저장소 전체에서 .cuda() 사용 0건). 타깃 EC2 t3.large 에는 GPU 가 없다.
#   기본 PyPI 휠은 CUDA 링크 빌드라 이미지에 약 3.4GB 의 CUDA 런타임이 딸려온다.
#
# --index-url 이 아니라 --extra-index-url 인 이유:
#   PyTorch 인덱스에는 torch/torchaudio 등 몇 개뿐이라, 완전 대체하면 나머지
#   패키지들을 찾지 못해 설치가 실패한다.
# =============================================================================
--extra-index-url https://download.pytorch.org/whl/cpu

