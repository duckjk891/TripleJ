<!DOCTYPE html>
<!-- [WebShell] v3.217 ④·①(b): expo 웹 기본 템플릿(@expo/cli static/template/index.html) 복사 후
     (1) viewport-fit=cover — iOS 사파리에서 env(safe-area-inset-*) 실값 공급.
         없으면 웹 insets.bottom=0으로 굳어 하단 시트 9곳이 사파리 하단 툴바에 가린다(PLAN F4).
     (2) 100dvh — iOS 사파리 동적 툴바 반영(@supports 미지원 브라우저는 100% 폴백).
     (3) 카카오톡 인앱 진입 즉시 외부 브라우저 탈출 인라인 스크립트(①(b)).
     expo export가 public/index.html을 템플릿으로 사용(LANG_ISO_CODE·WEB_TITLE 치환자는
     본문에만 — 치환기가 첫 1회만 치환하므로 주석에 기호 포함 표기 금지).
     스크립트·파비콘은 빌드가 주입. deploy.sh의 index.html→app.html 개명 흐름 그대로 호환. -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- v3.246 T3 [9b]: maximum-scale=1·user-scalable=no — iOS 사파리 핀치줌 후 축소 시
         페이지 리로드/리셋으로 진행(작곡 플로우 등)이 유실되는 문제 차단(앱형 RN웹 표준 조치).
         트레이드오프: 브라우저 확대(저시력 접근성) 제한 — 앱 내 글꼴 크기로 보완 필요. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- v3.298 [WebPush]: 아이폰은 홈 화면에 추가한 웹앱에서만 푸시 가능(Apple) — 매니페스트·standalone -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MAIDOL" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* v3.217 ④ [WebShell]: iOS 사파리 동적 툴바 — 100vh 계열 대신 100dvh(미지원=100% 폴백) */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
      /* v3.246 T3 [9b]: 당겨서 새로고침·경계 바운스 차단 + 핀치/더블탭 줌 제스처 무력화
         (pan-x pan-y = 스크롤 팬은 그대로 허용 — ScrollView 스크롤 영향 없음) */
      html,
      body {
        overscroll-behavior: none;
      }
      body {
        touch-action: pan-x pan-y;
      }
      /* v3.356 [BootSplash]: 번들을 받는 동안 하얀 빈 화면 대신 어두운 배경 + 로고 + 안내(React 가 #root 를 채우면 사라짐).
         배포 직후 큰 번들(약 1MB 압축)을 받는 몇 초 동안 사용자가 고장으로 알고 새로고침을 반복하던 문제(10-12 실사례). */
      html,
      body {
        background: #0a0a1a;
      }
      #maidol-boot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #f1efff;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #maidol-boot .logo {
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }
      #maidol-boot .logo span {
        color: #a855f7;
      }
      #maidol-boot .spin {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(168, 85, 247, 0.25);
        border-top-color: #a855f7;
        animation: maidol-spin 0.9s linear infinite;
      }
      #maidol-boot .msg {
        font-size: 14px;
        color: #a9a3c8;
        line-height: 1.6;
      }
      #maidol-boot button {
        margin-top: 4px;
        padding: 10px 22px;
        border-radius: 999px;
        border: 0;
        background: #8b5cf6;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }
      @keyframes maidol-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      /* v3.356 [BootSplash] 번들 스크립트가 깨진 응답(예: 배포 직후 HTML)으로 실패하면 캐시를 새로 받아 1번 다시 연다.
         같은 탭에서 최대 2번(sessionStorage) — 그 뒤엔 [다시 시도] 버튼. 12초 넘게 걸리면 안내 문구만 바꾼다. */
      (function () {
        var KEY = 'maidol_boot_heal';
        function msg(text, withButton) {
          var m = document.getElementById('maidol-boot-msg');
          if (!m) return;
          m.textContent = text;
          var b = document.getElementById('maidol-boot-retry');
          if (b) b.style.display = withButton ? 'inline-block' : 'none';
        }
        function heal(src) {
          var n = 0;
          try { n = Number(sessionStorage.getItem(KEY) || '0'); } catch (e) {}
          msg('새 버전을 받는 중이에요. 잠시만 기다려 주세요.', false);
          fetch(src, { cache: 'reload' }).then(function (r) {
            var ok = r.ok && (r.headers.get('content-type') || '').indexOf('javascript') >= 0;
            if (ok && n < 2) {
              try { sessionStorage.setItem(KEY, String(n + 1)); } catch (e) {}
              return r.arrayBuffer().then(function () { location.reload(); });
            }
            msg('새 버전을 준비하고 있어요. 1~2분 뒤 다시 시도해 주세요.', true);
          }).catch(function () {
            msg('연결이 원활하지 않아요. 다시 시도해 주세요.', true);
          });
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf('/_expo/') >= 0) heal(t.src);
        }, true);
        setTimeout(function () {
          if (document.getElementById('maidol-boot')) msg('처음 열 때는 조금 걸릴 수 있어요. 잠시만 기다려 주세요.', false);
        }, 12000);
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (!document.getElementById('maidol-boot')) { try { sessionStorage.removeItem(KEY); } catch (e) {} }
          }, 3000);
        });
      })();
    </script>
    <script>
      /* v3.217 ①(b) [WebShell]: 카카오톡 인앱 웹뷰 — 진입 즉시 외부 기본 브라우저 탈출 시도.
         인앱 웹뷰는 suspend로 백그라운드 오디오가 불가(코드 해결 불가 — PLAN F1) → 탈출이 유일 대응.
         kakaotalk://web/openExternal = iOS/Android 공통 기본 브라우저로 열기(공식 스킴).
         1.5초 내 미이탈 시 앱 번들의 InAppEscapeBanner가 안내 배너 폴백을 띄운다
         (아래 플래그로 번들 측 중복 자동 시도를 방지). query·hash 보존. */
      (function () {
        try {
          var ua = navigator.userAgent || '';
          if (/KAKAOTALK/i.test(ua)) {
            window.__MAIDOL_INAPP_ESCAPE_AT = Date.now();
            location.href =
              'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      /* v3.246 T3 [9b]: iOS 사파리는 viewport meta·touch-action만으로 핀치줌이 완전히 막히지
         않는다(터치 3개 등) — 비표준 gesture 이벤트를 직접 preventDefault. 줌 상태로 축소하다
         페이지가 리로드되며 진행이 유실되는 실사용 버그(60% iOS 웹) 대응. 다른 브라우저는
         gesturestart 미발화 = no-op. */
      (function () {
        try {
          var block = function (e) { e.preventDefault(); };
          document.addEventListener('gesturestart', block, { passive: false });
          document.addEventListener('gesturechange', block, { passive: false });
          document.addEventListener('gestureend', block, { passive: false });
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="maidol-boot">
        <div class="logo">M<span>AI</span>DOL</div>
        <div class="spin" aria-hidden="true"></div>
        <div class="msg" id="maidol-boot-msg">불러오는 중…</div>
        <button id="maidol-boot-retry" type="button" style="display: none" onclick="location.reload()">다시 시도</button>
      </div>
    </div>
  </body>
</html>
