// v3.385 [GoogleNative] 안드로이드 시스템 계정창(Credential Manager · Sign in with Google) 로컬 모듈
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.googlenativesignin'
version = '1.0.0'

android {
  namespace "expo.modules.googlenativesignin"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  implementation "androidx.credentials:credentials:1.6.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
  // 1.2.1 은 Kotlin 2.4 로 빌드돼 SDK 54(Kotlin 2.1) 컴파일러가 못 읽음 — 1.2.0(메타데이터 2.1) 고정
  implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
