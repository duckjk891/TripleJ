// v3.392 [NativePlayer] 안드로이드 음악 재생 엔진(Media3 ExoPlayer + MediaLibraryService) 로컬 모듈
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.maidolplayer'
version = '1.0.0'

android {
  namespace "expo.modules.maidolplayer"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // expo-audio(SDK 54)가 이미 쓰는 Media3 와 같은 버전 — 앱 안에 Media3 가 두 벌 생기지 않게 맞춘다
  def media3Version = "1.8.0"
  implementation "androidx.media3:media3-common:$media3Version"
  implementation "androidx.media3:media3-exoplayer:$media3Version"
  implementation "androidx.media3:media3-session:$media3Version"
}
