# v3.391 [AppLinks] api.maidol.ai.kr server 블록(443) 안, 다른 location 보다 위에 추가.
# 파일은 /home/ubuntu/maidol/well-known/ 에 assetlinks.json · apple-app-site-association(aasa_api.json 내용) 로 둔다.
location = /.well-known/assetlinks.json {
    alias /home/ubuntu/maidol/well-known/assetlinks.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
}
location = /.well-known/apple-app-site-association {
    alias /home/ubuntu/maidol/well-known/apple-app-site-association;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600";
}
